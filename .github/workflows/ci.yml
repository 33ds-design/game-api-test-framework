name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 功能 / 白盒 / 缺陷验证测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python（版本取自 .python-version）
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 压测单独放到 performance job：其延迟断言依赖 runner 性能，
      # 在共享 CI 机器上会抖动，不适合作为阻塞门禁。
      - name: 运行功能 / 白盒 / 缺陷验证测试
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_performance.py \
            --cov=mock_server --cov-branch --cov-report=term-missing

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.html
          if-no-files-found: ignore

  performance:
    name: 并发压测（非阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python（版本取自 .python-version）
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 运行并发压测
        run: python -m pytest tests/test_performance.py -v -s